name: 04 - Sync Fork & go.sum

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: "Fork 库的新 Commit Hash（留空则仅重新生成 go.sum）"
        required: false
        type: string

permissions:
  contents: write

env:
  UPSTREAM_MODULE: github.com/jchv/go-webview2
  FORK_MODULE: github.com/6hx0ube8j9/go-webview2

jobs:
  sync-deps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Update go.mod & Regenerate go.sum
        env:
          GOPROXY: direct
          COMMIT_HASH: ${{ inputs.commit_hash }}
        run: |
          HASH=$(echo "$COMMIT_HASH" | xargs)

          if [ -n "$HASH" ]; then
            go mod edit -replace="${UPSTREAM_MODULE}=${FORK_MODULE}@${HASH}"
          fi

          rm -f go.sum
          go mod tidy

      - name: Commit updated go.mod & go.sum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          if ! git diff --staged --quiet; then
            git commit -m "chore: update fork dependency and regenerate go.sum"
            git push
          fi
