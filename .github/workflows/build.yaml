name: Build mihomo-tray

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        goarch:
          - amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Convert PNG to ICO (Incremental)
        shell: pwsh
        run: |
          $iconDir = "winres/icons"

          if (Test-Path $iconDir) {
              Get-ChildItem -Path $iconDir -Filter "*.png" | ForEach-Object {
                  $pngPath = $_.FullName
                  $icoPath = [System.IO.Path]::ChangeExtension($pngPath, ".ico")

                  if (Test-Path $icoPath) {
                      Write-Host ">> [Skip] $($_.BaseName).ico already exists."
                  } else {
                      Write-Host ">> [Convert] Generating $($_.BaseName).ico from $($_.Name)..."
                      if ($_.BaseName -eq "app") {
                          magick $pngPath -define icon:auto-resize=256,64,48,32,24,16 $icoPath
                      } else {
                          magick $pngPath -define icon:auto-resize=48,32,24,20,16 $icoPath
                      }
                  }
              }
          } else {
              Write-Warning "Directory '$iconDir' not found."
          }

      - name: Generate Windows Resources
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --arch ${{ matrix.goarch }}

      - name: Build EXE
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOOS: 'windows'
          GOARCH: ${{ matrix.goarch }}
        run: |
          go env GOOS GOARCH CGO_ENABLED
          New-Item -ItemType Directory -Force -Path "release"
          go build -mod=readonly -ldflags="-s -w -H=windowsgui" -o "release/mihomo-tray.exe" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-tray-${{ matrix.goarch }}
          path: release/mihomo-tray.exe
          if-no-files-found: error
          retention-days: 14
