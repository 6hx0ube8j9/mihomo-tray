name: Build mihomo-tray

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        goarch:
          - amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Generate Windows Resources
        shell: pwsh
        run: |
          if (!(Test-Path "cmd/mihomo-tray/winres/icon.ico")) {
            Write-Error "Icon file not found at cmd/mihomo-tray/winres/icon.ico"
            exit 1
          }
          if (!(Test-Path "cmd/mihomo-tray/winres/assembly.xml")) {
            Write-Error "Manifest file not found at cmd/mihomo-tray/winres/assembly.xml"
            exit 1
          }
          go run github.com/tc-hib/go-winres@latest make --arch ${{ matrix.goarch }} --in cmd/mihomo-tray/winres --out cmd/mihomo-tray

      - name: Build EXE
        shell: pwsh
        run: |
          $env:CGO_ENABLED="0"
          $env:GOARCH="${{ matrix.goarch }}"
          go env GOOS GOARCH CGO_ENABLED
          New-Item -ItemType Directory -Force -Path "release"
          go build -mod=readonly -ldflags="-s -w -H=windowsgui" -o "release/mihomo-tray.exe" ./cmd/mihomo-tray

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-tray-${{ matrix.goarch }}
          path: release/mihomo-tray.exe
