name: Build mihomo-tray

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        goarch:
          - amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Generate Windows Resources
        shell: pwsh
        run: |
          go run github.com/tc-hib/go-winres@latest make --arch ${{ matrix.goarch }}

      - name: Build EXE
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOARCH: ${{ matrix.goarch }}
        run: |
          go env GOOS GOARCH CGO_ENABLED
          New-Item -ItemType Directory -Force -Path "release"
          go build -mod=readonly -ldflags="-s -w -H=windowsgui" -o "release/mihomo-tray.exe" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-tray-${{ matrix.goarch }}
          path: release/mihomo-tray.exe
          if-no-files-found: error
