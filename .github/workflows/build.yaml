name: Build mihomo-tray

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        goarch:
          - amd64
          # - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Generate Windows Resources
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --arch ${{ matrix.goarch }}

      - name: Build EXE
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOOS: 'windows'
          GOARCH: ${{ matrix.goarch }}
        run: |
          go env GOOS GOARCH CGO_ENABLED
          New-Item -ItemType Directory -Force -Path "release"
          
          $commit = $env:GITHUB_SHA.Substring(0, 7)
          $flags = "-s -w -H=windowsgui -X 'main.version=$commit'"
          
          go build -mod=readonly -ldflags="$flags" -o "release/mihomo-tray.exe" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-tray-windows-${{ matrix.goarch }}
          path: release/mihomo-tray.exe
          if-no-files-found: error
          retention-days: 14
