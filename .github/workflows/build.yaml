name: 01 - Build mihomo-tray

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          # - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Generate Windows Resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --arch ${{ matrix.goarch }}

      - name: Build and Package EXE
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOOS: 'windows'
          GOARCH: ${{ matrix.goarch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          New-Item -ItemType Directory -Force -Path "release/mihomo-tray" | Out-Null

          $commit = $env:GITHUB_SHA.Substring(0, 7)
          $flags = "-s -w -H=windowsgui -X 'main.version=$commit'"

          go build -mod=readonly -ldflags="$flags" -o "release/mihomo-tray/mihomo-tray.exe" .

          $zipName = "mihomo-tray-windows-${{ matrix.goarch }}-$commit.zip"
          Compress-Archive -Path "release/mihomo-tray" -DestinationPath "release/$zipName" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-tray-windows-${{ matrix.goarch }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 3
