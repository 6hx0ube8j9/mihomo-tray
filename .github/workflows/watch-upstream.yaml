name: 03 - Watch Upstream Updates

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare with Latest Workflow Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          MIHOMO_TAG=$(gh release view --repo MetaCubeX/mihomo --json tagName -q .tagName)
          ZASHBOARD_TAG=$(gh release view --repo Zephyruso/zashboard --json tagName -q .tagName)

          if [[ -z "$MIHOMO_TAG" || -z "$ZASHBOARD_TAG" ]]; then
            echo "Failed to fetch upstream tags (mihomo='$MIHOMO_TAG', zashboard='$ZASHBOARD_TAG')."
            exit 1
          fi

          UPSTREAM_VER="${MIHOMO_TAG}_${ZASHBOARD_TAG}"
          TARGET_TITLE="Build Bundle (${UPSTREAM_VER})"

          MATCHED_RUN=$(gh run list --workflow build-bundle.yaml --event workflow_dispatch --limit 20 \
            --json displayTitle,status,conclusion | \
            jq -r --arg title "$TARGET_TITLE" \
            '[.[] | select((.status == "in_progress" or .status == "queued" or .conclusion == "success") and .displayTitle == $title)] | .[0].displayTitle // ""')

          echo "Latest Upstream: $UPSTREAM_VER"
          echo "Matched Run    : ${MATCHED_RUN:-<none>}"

          if [[ -z "$MATCHED_RUN" ]]; then
            echo "New upstream version found ($UPSTREAM_VER). Triggering build-bundle..."
            gh workflow run build-bundle.yaml -f upstream_ver="$UPSTREAM_VER"
          else
            echo "Already built or running for $UPSTREAM_VER. Skipping."
          fi
